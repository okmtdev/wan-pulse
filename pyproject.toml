[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wan-pulse"
version = "0.1.0"
description = "Real-time capture skeleton that records a mic, skips silence, and saves only the segments where a dog barked (with pre/post margins) as .wav files."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.21",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
wan-pulse = "wan_pulse.cli:main"

[tool.setuptools]
packages = ["wan_pulse"]
